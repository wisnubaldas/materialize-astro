[project]
name = "mau-desktop-app"
version = "0.1.0"
description = "Desktop frontend MAU APP berbasis PySide6"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.9.0",
  "qt-material>=2.14",
  "httpx>=0.28.0",
  "pydantic>=2.11.0",
  "email-validator>=2.2.0",
  "python-dotenv>=1.1.0",
  "keyring>=25.6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["app"]
addopts = "-q"
