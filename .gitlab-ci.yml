production:
  script:
    - echo "🚀 Deploying to Production"
    - ssh -o StrictHostKeyChecking=no root@$server -p 23022 $script
  only:
    - production

development:
  script:
    - echo "🧩 Deploying Development"
    - ssh -o StrictHostKeyChecking=no root@$server_dev -p 23022 $dev_script
  only:
    - master
